name: Packed evidence regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MUNIN_EMBEDDINGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No dependency or data cache: every run demonstrates a cold checkout
      # can obtain the exact frozen inputs without local state or model calls.
      - run: npm ci
      - name: Compare all 500 questions against the reviewed baseline
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-results"
          npm run benchmark:evidence:check -- \
            --artifacts-dir "$RUNNER_TEMP/evidence-inputs" \
            --output "$RUNNER_TEMP/evidence-results/report.json" \
            --packing-comparison skip-oversized \
            --passage-comparison query-passages-v1 \
            --gold-turns benchmark/evidence-metric/comparisons/longmemeval-s-passages-20261020/gold-turns.json \
            --message-comparison query-message-neighbors-v1 \
            --message-boundaries benchmark/evidence-metric/comparisons/longmemeval-s-message-neighbors-20261021/message-boundaries.json \
            --core-comparison query-message-cores-v1
      - name: Summarize the result
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const report = join(process.env.RUNNER_TEMP, 'evidence-results/report.json');
          const receipt = { revision: process.env.GITHUB_SHA, node: process.version, platform: process.platform, arch: process.arch, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT };
          if (existsSync(report)) {
            const result = JSON.parse(readFileSync(report, 'utf8'));
            writeFileSync(join(process.env.RUNNER_TEMP, 'evidence-results/runner.json'), JSON.stringify(receipt, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Packed evidence: **${result.quality_state}**\n\nAll-gold entry IDs: ${result.summary?.all_gold_count ?? 'unavailable'}/${result.summary?.query_count ?? 'unavailable'}. Gained: ${result.comparison?.gained_question_ids?.length ?? 'unavailable'}. Lost: ${result.comparison?.lost_question_ids?.length ?? 'unavailable'}.\n\nThis measures entry-ID presence, not answer accuracy. See the report artifact for per-question changes.\n`);
            const packing = result.packing_comparison;
            if (packing) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPacking experiment at **8,192 estimated tokens** (${packing.strategy}):\n\n| Stage | All gold | Some gold | No gold |\n| --- | ---: | ---: | ---: |\n${[['Retrieved top 10', packing.stages.retrieval], ['Legacy packing', packing.stages.legacy_packed], ['Candidate packing', packing.stages.candidate_packed]].map(([name, stage]) => `| ${name} | ${stage.all_gold} | ${stage.partial_gold} | ${stage.no_gold} |`).join('\n')}\n\nGained all-gold questions: ${packing.gained_question_ids.length}. Lost: ${packing.lost_question_ids.length}. Any loss: ${packing.regression}. The candidate is experimental; the default packing and reviewed baseline are unchanged. Full per-question gold-ID gains/losses are in the report.\n`);
            }
            const passage = result.passage_comparison;
            if (passage) {
              const coverage = passage.annotated_message_coverage;
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPassage experiment at **8,192 estimated tokens** (${passage.strategy}):\n\n| Complete annotated-message coverage | Questions |\n| --- | ---: |\n| Retrieved top 10 | ${coverage.retrieval.all_turn_count}/${coverage.eligible_question_count} |\n| Legacy packing | ${coverage.legacy_packed.all_turn_count}/${coverage.eligible_question_count} |\n| Passage packing | ${coverage.candidate_packed.all_turn_count}/${coverage.eligible_question_count} |\n\nGained complete-coverage questions: ${coverage.gained_question_ids.length}. Lost: ${coverage.lost_question_ids.length}. Excluded without positive annotations in every expected session: ${coverage.excluded_question_ids.length}. Any loss: ${coverage.regression}.\n\nEntry-ID proxy: ${passage.entry_id_proxy.stages.legacy_packed.all_gold} → ${passage.entry_id_proxy.stages.candidate_packed.all_gold}; gained ${passage.entry_id_proxy.gained_question_ids.length}, lost ${passage.entry_id_proxy.lost_question_ids.length}.\n\nFull-message coverage is a conservative proxy, not reader answer accuracy. Experimental losses remain visible independently of the baseline gate. See the retained report for all selected source ranges and message gains/losses.\n`);
            }
            const messages = result.message_comparison;
            if (messages) {
              const baseline = messages.versus_legacy.annotated_message_coverage;
              const passages = messages.versus_passages.annotated_message_coverage;
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nWhole-message + neighbor experiment at **8,192 estimated tokens** (${messages.strategy}):\n\n| Full annotated-message coverage | Questions |\n| --- | ---: |\n| Baseline | ${baseline.reference_packed.all_turn_count}/${baseline.eligible_question_count} |\n| Previous passage candidate | ${passages.reference_packed.all_turn_count}/${passages.eligible_question_count} |\n| Whole-message candidate | ${baseline.candidate_packed.all_turn_count}/${baseline.eligible_question_count} |\n\nGained/lost questions versus baseline: ${baseline.gained_question_ids.length}/${baseline.lost_question_ids.length}; versus passages: ${passages.gained_question_ids.length}/${passages.lost_question_ids.length}. Partially selected messages: ${messages.whole_message_conservation.partial_message_count}. Full paired/category/range evidence is in the report. Experimental losses are informational; reader accuracy is unmeasured.\n`);
            }
            const cores = result.core_comparison;
            if (cores) {
              const pairs = [['#341 baseline', cores.versus_legacy], ['#390 passages', cores.versus_passages], ['#391 neighbors', cores.versus_neighbors]];
              const rows = pairs.map(([name, pair]) => {
                const c = pair.annotated_message_coverage;
                return `| ${name} | ${c.reference_packed.all_turn_count}/${c.eligible_question_count} | ${c.candidate_packed.all_turn_count}/${c.eligible_question_count} | ${c.gained_question_ids.length} / ${c.lost_question_ids.length} |`;
              });
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nCore-first experiment at **8,192 estimated tokens** (${cores.strategy}):\n\n| Reference | Reference complete | Candidate complete | Gained / lost questions |\n| --- | ---: | ---: | ---: |\n${rows.join('\n')}\n\nPartial messages: ${cores.whole_message_conservation.partial_message_count}. Rule frozen before measurement; regression-led development-set iteration, not held-out generalization or reader accuracy. Experimental losses remain visible and informational.\n`);
            }
          } else {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Packed evidence: **invalid / no report**. See the failing setup or download step; this is not a successful comparison.\n');
          }
          JS
      - name: Retain comparison and verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-results/
          if-no-files-found: warn
          retention-days: 30
